
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeerOnline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/style.css') }}">    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='beer.png', v=2) }}">
</head>
<body>

    <header>
        <h1>BeerOnline</h1>

        <div class="location-selector">
            <button id="location-button" onclick="toggleLocationDropdown()">
                <span id="location-name">Leiden</span>
                <span class="dropdown-arrow">▼</span>
            </button>

            <div id="location-dropdown" class="location-dropdown hidden">
                <h3>Change location</h3>

                <input
                    type="text"
                    id="location-input"
                    placeholder="Enter city or address..."
                >
                <button style="width:100%" class="button" onclick="searchLocation()">Search</button>

                <button style="width:100%" class="button" onclick="useMyLocation()">
                    Use my current location
                </button>

                <p id="location-error"></p>
            </div>
        </div>
    </header>

    <main>
        <div class="left-panel">
            <div class="left-top">
                <div id="weather-card">
                    <h3 id="weather-headline"></h3>
                    <p id="weather-condition"></p>
                    <h2 id="weather-temp"></h2>
                    <p id="weather-advice"></p>
                </div>
                <section id="beer-recommendation" class="beer-card" aria-labelledby="beer-heading" hidden>
                    <p class="beer-eyebrow">YOUR WEATHER-BASED PICK</p>
                    <h2 id="beer-heading">🍺 <span id="beer-name"></span></h2>
                    <p id="beer-style" class="beer-style"></p>
                    <p id="beer-tagline" class="beer-tagline"></p>
                    <p id="beer-reason" class="beer-reason"></p>
                    <p id="beer-abv" class="beer-abv"></p>
                </section>
            </div>
            <div class="left-bottom">
                <div id="pub-list">
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div id="map" style="height: 100%"></div>
        </div>

        <div class="popup" id="age-popup">
            <h2>Are you 18 or older?</h2>
            <p>
                You must be at least 18 years old to use this app.
                Please confirm your age to continue.
            </p>
            <div style="gap: 15px; display: flex">
                <button class="button" onclick="confirmAge()">Yes, I'm 18 or older</button>
                <button class="button" onclick="denyAge()">No, I'm under 18</button>
            </div>
        </div>

    </main>
    <script>
        window.DEFAULT_LOCATION = {{ default_location | tojson }};
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='/js/age.js') }}"></script>
    <script src="{{ url_for('static', filename='/js/location.js') }}"></script>
    <script src="{{ url_for('static', filename='/js/pubrecommender.js') }}"></script>
    <script src="{{ url_for('static', filename='/js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='/js/weather.js') }}"></script>
    <script src="{{ url_for('static', filename='js/weather-card.js') }}"></script>
</body>
</html>
